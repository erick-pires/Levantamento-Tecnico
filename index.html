<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<meta name="description" content="Levantamento técnico por disciplina, com fotos e relatórios PDF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Levantamento Técnico</title>
<style>
:root{color-scheme:light;--bg:#f3f5f7;--card:#fff;--ink:#18232d;--muted:#65727e;--line:#dce2e7;--accent:#185b78;--soft:#eaf1f4;--danger:#a83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#17212b;color:#fff;padding:18px 16px;padding-top:max(18px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.head{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:#24485b;display:grid;place-items:center;font-size:21px}
h1{font-size:18px;margin:0}header small{color:#c5d0d8}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h2{font-size:21px;margin:8px 0 4px}.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #17212b08}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.folder{font-size:26px}
button{font:600 15px system-ui;border:0;border-radius:12px;padding:13px 15px;background:var(--accent);color:#fff;cursor:pointer}
button.secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.danger{background:#fff0f0;color:var(--danger);border:1px solid #efcccc}
button.small{padding:8px 10px;font-size:13px}button:disabled{opacity:.5}
.primary{width:100%;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],textarea{width:100%;padding:13px;border:1px solid #cbd4dc;border-radius:11px;font:16px system-ui;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #91bdcf;border-color:var(--accent)}
.hidden{display:none!important}.item-title{font-weight:750;font-size:17px}.muted{color:var(--muted);font-size:13px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.photo{aspect-ratio:1;border-radius:11px;overflow:hidden;background:#edf1f4;border:1px dashed #b9c5ce;display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;top:4px;right:4px;padding:4px 7px;border-radius:8px;background:#17212bcc}
.photo-add{width:100%;height:100%;background:transparent;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
input[type=file]{display:none}
.back{background:transparent;color:#fff;padding:5px 8px;font-size:22px}
.pill{font-size:12px;background:var(--soft);padding:5px 9px;border-radius:99px;color:#365565}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media print{
 body{background:white;color:#111}header,.no-print,button,#app{display:none!important}#printReport{display:block!important}main{max-width:none;padding:0;margin:0}
 .card{box-shadow:none;border:0;border-radius:0;padding:8px 0;margin:0;break-inside:avoid}
 .report-head{display:block!important;border-bottom:2px solid #333;padding:0 0 12px;margin-bottom:16px}
 .report-item{break-inside:avoid;border-bottom:1px solid #bbb;padding:12px 0}
 .report-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .report-photos img{width:100%;max-height:220px;object-fit:contain}
 .report-description{white-space:pre-wrap}
}
</style>
</head>
<body>
<header><div class="head">
  <button id="backBtn" class="back hidden" aria-label="Voltar">‹</button>
  <div class="logo">▤</div><div><h1>Levantamento Técnico</h1><small>Registros organizados por disciplina</small></div>
</div></header>
<main id="app">
<section id="home">
  <h2>Minhas disciplinas</h2><p class="sub">Crie uma pasta para cada disciplina do levantamento.</p>
  <div id="disciplineList"></div>
  <div class="card">
    <label for="newDiscipline">Nova disciplina</label>
    <input id="newDiscipline" type="text" placeholder="Ex.: HVAC, Elétrica, Hidráulica">
    <button class="primary" id="addDiscipline">＋ Criar disciplina</button>
  </div>
</section>
<section id="detail" class="hidden">
  <div class="row between"><div><h2 id="disciplineTitle"></h2><p class="sub" id="itemCount"></p></div><button id="pdfBtn">▤ Gerar PDF</button></div>
  <div id="itemList"></div>
  <div class="card" id="itemForm">
    <h3 id="formTitle" style="margin:0">Adicionar equipamento</h3>
    <label for="itemId">ID</label><input id="itemId" type="text" placeholder="Ex.: EXA 038">
    <label>Fotografias (até 3)</label>
    <div class="photos" id="photoSlots"></div>
    <label for="description">Descrição</label><textarea id="description" placeholder="Descreva o equipamento e as observações técnicas..."></textarea>
    <div class="actions" style="margin-top:14px"><button id="saveItem">＋ Adicionar item</button><button class="secondary hidden" id="cancelEdit">Cancelar edição</button></div>
  </div>
</section>
</main>
<footer>Os dados ficam salvos neste aparelho. Faça cópias dos relatórios PDF.</footer>
<script>
const DB_NAME='levantamento-tecnico-db', STORE='data';
let db, disciplines=[], activeId=null, editingId=null, photos=[null,null,null];
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getData(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).get('all');r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function putData(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(disciplines,'all');t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showHome(){activeId=null;$('home').classList.remove('hidden');$('detail').classList.add('hidden');$('backBtn').classList.add('hidden');renderHome()}
function renderHome(){
 const box=$('disciplineList');box.innerHTML='';
 if(!disciplines.length)box.innerHTML='<div class="card empty">Nenhuma disciplina cadastrada.<br>Crie sua primeira pasta abaixo.</div>';
 disciplines.forEach(d=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row between"><div class="row" style="min-width:0"><span class="folder">📁</span><div><b>${esc(d.name)}</b><div class="muted">${d.items.length} equipamento(s)</div></div></div><span class="pill">Abrir ›</span></div><div class="actions" style="margin-top:12px"><button class="secondary small open">Abrir disciplina</button><button class="secondary small rename">Renomear</button><button class="danger small delete">Excluir</button></div>`;
 el.querySelector('.open').onclick=()=>openDiscipline(d.id);el.querySelector('.row').onclick=()=>openDiscipline(d.id);
 el.querySelector('.rename').onclick=async()=>{const n=prompt('Nome da disciplina:',d.name);if(n&&n.trim()){d.name=n.trim();await putData();renderHome()}};
 el.querySelector('.delete').onclick=async()=>{if(confirm(`Excluir a disciplina "${d.name}" e todos os seus equipamentos?`)){disciplines=disciplines.filter(x=>x.id!==d.id);await putData();renderHome()}};
 box.appendChild(el)})
}
async function addDiscipline(){const n=$('newDiscipline').value.trim();if(!n){alert('Digite o nome da disciplina.');return}if(disciplines.some(d=>d.name.toLowerCase()===n.toLowerCase())){alert('Essa disciplina já existe.');return}disciplines.push({id:uid(),name:n,items:[]});$('newDiscipline').value='';await putData();renderHome()}
function openDiscipline(id){activeId=id;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('backBtn').classList.remove('hidden');renderDetail();resetForm()}
function active(){return disciplines.find(d=>d.id===activeId)}
function renderDetail(){
 const d=active();if(!d)return;$('disciplineTitle').textContent=d.name;$('itemCount').textContent=`${d.items.length} equipamento(s) cadastrado(s)`;
 const list=$('itemList');list.innerHTML='';
 if(!d.items.length)list.innerHTML='<div class="card empty">Ainda não há equipamentos nesta disciplina.<br>Cadastre o primeiro abaixo.</div>';
 d.items.forEach(it=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row between"><div class="item-title">ID: ${esc(it.id)}</div><span class="pill">${it.photos.filter(Boolean).length}/3 fotos</span></div><div class="photos">${it.photos.map((p,i)=>p?`<div class="photo"><img src="${p}" alt="Foto ${i+1}"></div>`:'').join('')}</div><div style="margin-top:12px;font-size:14px;white-space:pre-wrap">${esc(it.description)||'<span class="muted">Sem descrição</span>'}</div><div class="actions no-print" style="margin-top:12px"><button class="secondary small edit">Editar</button><button class="danger small delete">Excluir</button></div>`;
 el.querySelector('.edit').onclick=()=>loadEdit(it.id);el.querySelector('.delete').onclick=async()=>{if(confirm(`Excluir o item ${it.id}?`)){d.items=d.items.filter(x=>x.id!==it.id);await putData();renderDetail()}};
 list.appendChild(el)})
}
function renderSlots(){const box=$('photoSlots');box.innerHTML='';photos.forEach((p,i)=>{const slot=document.createElement('div');slot.className='photo';if(p){slot.innerHTML=`<img src="${p}" alt="Foto ${i+1}"><button type="button" aria-label="Remover foto">×</button>`;slot.querySelector('button').onclick=()=>{photos[i]=null;renderSlots()}}else{slot.innerHTML=`<button type="button" class="photo-add"><span style="font-size:25px">＋</span><span>Adicionar imagem</span></button><input type="file" accept="image/*" capture="environment">`;slot.querySelector('button').onclick=()=>slot.querySelector('input').click();slot.querySelector('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;photos[i]=await resizeImage(f);renderSlots()}}box.appendChild(slot)})}
function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1500,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function resetForm(){editingId=null;photos=[null,null,null];$('itemId').value='';$('description').value='';$('formTitle').textContent='Adicionar equipamento';$('saveItem').textContent='＋ Adicionar item';$('cancelEdit').classList.add('hidden');renderSlots()}
function loadEdit(id){const it=active().items.find(x=>x.id===id);if(!it)return;editingId=id;photos=[...it.photos];$('itemId').value=it.id;$('description').value=it.description;$('formTitle').textContent='Editar equipamento';$('saveItem').textContent='Salvar alterações';$('cancelEdit').classList.remove('hidden');renderSlots();$('itemForm').scrollIntoView({behavior:'smooth'})}
async function saveItem(){const id=$('itemId').value.trim();if(!id){alert('Preencha o ID do equipamento.');return}if(!photos.some(Boolean)){if(!confirm('Este item está sem foto. Deseja salvar mesmo assim?'))return}
 const d=active();if(d.items.some(x=>x.id.toLowerCase()===id.toLowerCase()&&x.id!==editingId)){alert('Já existe um equipamento com esse ID nesta disciplina.');return}
 const obj={id,photos:[...photos],description:$('description').value.trim()};
 if(editingId){const ix=d.items.findIndex(x=>x.id===editingId);d.items[ix]=obj}else d.items.push(obj);
 await putData();renderDetail();resetForm();$('itemForm').scrollIntoView({behavior:'smooth'})}
function generatePDF(){
 const d=active();if(!d)return;
 const old=document.title;document.title=`Levantamento - ${d.name}`;
 const report=document.createElement('div');report.id='printReport';
 report.innerHTML=`<div class="report-head" style="display:none"><h1>LEVANTAMENTO TÉCNICO</h1><h2>${esc(d.name)}</h2><p>Quantidade de equipamentos: ${d.items.length}</p><p>Data: ${new Date().toLocaleDateString('pt-BR')}</p></div>`;
 d.items.forEach((it,i)=>{const sec=document.createElement('section');sec.className='report-item';const imgs=it.photos.filter(Boolean).map(p=>`<img src="${p}">`).join('');sec.innerHTML=`<h3>${i+1}. ID: ${esc(it.id)}</h3><div class="report-photos">${imgs}</div><p class="report-description">${esc(it.description)||'Sem descrição informada.'}</p>`;report.appendChild(sec)});
 document.body.appendChild(report);window.print();report.remove();document.title=old;
}
$('addDiscipline').onclick=addDiscipline;$('newDiscipline').addEventListener('keydown',e=>{if(e.key==='Enter')addDiscipline()});
$('backBtn').onclick=showHome;$('saveItem').onclick=saveItem;$('cancelEdit').onclick=resetForm;$('pdfBtn').onclick=generatePDF;
(async()=>{db=await openDB();disciplines=await getData();showHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})().catch(e=>{console.error(e);alert('Não foi possível iniciar o armazenamento local neste navegador.')});
</script>
</body></html>
